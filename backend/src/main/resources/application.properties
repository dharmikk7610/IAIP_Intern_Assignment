spring.application.name=employee-management

# ===============================
# = SERVER
# ===============================
server.port=9998
server.address=0.0.0.0

# ===============================
# = DATASOURCE
# ===============================
# Credentials are NOT stored here. They come from (first match wins):
#   1. Environment variables DB_URL / DB_USERNAME / DB_PASSWORD
#   2. application-local.properties (git-ignored, see application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/EMPLOYEEMNG}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# = JPA / HIBERNATE
# ===============================
# Show SQL queries in console (bind values are not printed)
spring.jpa.show-sql=true

# Format SQL queries (easier to read)
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Automatically create / update schema
# (use "update" in dev, never in production)
spring.jpa.hibernate.ddl-auto=update

# Only add a unique constraint if one with that name is missing
# (the default drops and re-creates them on every start)
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY

# Don't keep DB sessions open during JSON rendering
spring.jpa.open-in-view=false

# ===============================
# = SENSITIVE DATA KEYS (Base64, 32 bytes each) - from env / application-local.properties
# ===============================
app.security.encryption-key=${ENCRYPTION_KEY}
app.security.hash-key=${HASH_KEY}

# ===============================
# = AUTHENTICATION (JWT) / CORS
# ===============================
# Base64 key of at least 32 bytes, from env / application-local.properties
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-minutes=60
# Browser origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Insert sample employees on start-up when the employees table is empty
app.seed.enabled=true

# ===============================
# = SWAGGER
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
